<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给懷萩</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        let times = 0;
        function ShowText() {
            times++;
            var button = document.getElementById("button1");
            if(times>=1 && times<=2) {
            button.innerHTML = `<span>繼續按 你點了${times}下</span>`;
            document.body.style.backgroundColor = "#aaaaaa";
            }
            if(times>=3 && times<=4) {
                button.innerHTML = `<span>有一件事 你點了${times}下</span>`;
                document.body.style.backgroundColor = "#cccccc";
            }
            if(times>=5 && times<=6) {
                button.innerHTML = `<span>要告訴你 你點了${times}下</span>`;
                document.body.style.backgroundColor = "yellow";
            }
            if(times>=7 && times<=98) {
                button.innerHTML = `<span>點到100下就告訴你 你點了${times}下了</span>`;
                document.body.style.backgroundColor = "pink";
            }
            if(times===99) {
                button.innerHTML = `<span>就是 你點了${times}下</span>`;
            }
            if(times>=100 && times<=110) {
                button.innerHTML = `<span>我喜歡你 你點了${times}下</span>`;
                document.body.style.backgroundColor = "cyan";
            }
            if(times>=111 && times<=130) {
                button.innerHTML = `<span>你還在繼續點！ 你點了${times}下</span>`;
            }
            if(times>=131 && times<=150) {
                button.innerHTML = `<span>你很有毅力！ 你點了${times}下</span>`;
            }
            if(times>=151 && times<=160) {
                button.innerHTML = `<span>開始點慢一點！ 你點了${times}下</span>`;
            }
            if(times===161) {
                button.innerHTML = `<span>你是真的在關心我嗎？ 你點了${times}下</span>`;
            }
            if(times===162) {
                button.innerHTML = `<span>還是你只是不信後面還有東西？ 你點了${times}下</span>`;
            }
            if(times===163) {
                button.innerHTML = `<span>這個網站我花了很多時間 你點了${times}下</span>`;
            }
            if(times===164) {
                button.innerHTML = `<span>也看到這是誰才擁有 你點了${times}下</span>`;
            }
            if(times===165) {
                button.innerHTML = `<span>你！ 你點了${times}下</span>`;
            }
            if(times===166) {
                button.innerHTML = `<span>就只有你！ 你點了${times}下</span>`;
            }
            if(times===167) {
                button.innerHTML = `<span>如果更改是可以查的！ 你點了${times}下</span>`;
            }
            if(times===168) {
                button.innerHTML = `<span>但是我不打算更改！ 你點了${times}下</span>`;
            }
            if(times===169) {
                button.innerHTML = `<span>網站是<a href="https://github.com/Moonhorse3595/Moonhorse3595.github.io">這個</a> 你點了${times}下</span>`;
            }
            if(times===170) {
                button.innerHTML = `<span>要歸0了！ 你點了${times}下</span>`;
            }
            if(times===171) {
                button.innerHTML = `<span>但是我還想聊聊天 你點了${times}下</span>`;
            }
            if(times===172) {
                button.innerHTML = `<span>算了，不聊了，聽不懂也沒關係！ 你點了${times}下</span>`;
                times=0;
            }
        }
    </script>
</head>
<body>
    <h2 style="text-align: center;">持續按下面按鈕</h2>
    <div style="text-align: center; background-color: cyan; padding: 20px; border-radius: 10px;">
        <button class="btn btn-warning" id="button1" onclick="ShowText()"><span>點擊我獲取訊息</span></button>
    </div>
</body>
</html>
