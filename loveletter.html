<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给懷萩</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        let times = 0;
        function ShowText() {
            times++;
            var button = document.getElementById("button1");
            if(times===1) {
            button.innerHTML = "<span>繼續按</span>";
            }
            if(times===2) {
                button.innerHTML = "<span>有一件事</span>";
            }
            if(times===3) {
                button.innerHTML = "<span>要告訴你</span>";
            }
            if(times===4) {
                button.innerHTML = "<span>就是</span>";
            }
            if(times===5) {
                button.innerHTML = "<span>我喜歡你</span>";
            }
        }
    </script>
</head>
<body>
    <h2>持續按下面按鈕</h2>
    <button class="btn btn-primary" id="button1" onclick="ShowText()"><span>點擊我獲取訊息</span></button>
</body>
</html>
